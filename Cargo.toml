[workspace]
members = ["rwf-bin", "rwf-lib"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
time = { version = "0.3", features = ["local-offset", "formatting"] }
dirs = "5.0"

# Existing dependencies
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"

# Property-based testing
proptest = "1.5"

# Archive handling
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sevenz-rust = { version = "0.6", features = ["compress"] }
tar = "0.4"
flate2 = "1.0"
iso9660 = "0.1"

# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Testing utilities
tempfile = "3.14"
assert_fs = "1.1"
predicates = "3.1"

# Migemo support
rustmigemo = { git = "https://github.com/oguna/rustmigemo" }
