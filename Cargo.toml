[workspace]
members = ["rwf-bin", "rwf-lib"]
resolver = "2"

[workspace.lints.rust]
# volume_info.rs (Win32 API) のみ #![allow(unsafe_code)] + SAFETY コメントで許可
unsafe_code = "deny"

[workspace.lints.clippy]
# 非テストコードの unwrap 禁止（テストは clippy.toml の allow-unwrap-in-tests で除外）。
# 既存違反モジュールは #![allow(clippy::unwrap_used)] // TODO(M6): ratchet を暫定付与し、
# M6 で順次撤去する。新規モジュールは即座にこの lint の対象となる。
unwrap_used = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
time = { version = "0.3", features = ["local-offset", "formatting"] }
dirs = "5.0"

# Existing dependencies
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"

# Property-based testing
proptest = "1.5"

# Archive handling
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sevenz-rust = { version = "0.6", features = ["compress"] }
tar = "0.4"
flate2 = "1.0"
iso9660 = "0.1"

# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# Testing utilities
tempfile = "3.14"
assert_fs = "1.1"
predicates = "3.1"

# Migemo support
rustmigemo = { git = "https://github.com/oguna/rustmigemo" }

# Debuginfo is the dominant cost of MSVC linking: full PDB generation on every
# test-binary link dwarfs the tests themselves (the whole suite executes in ~27s;
# the rest of a local run is compile + link). "line-tables-only" keeps file/line
# in panic backtraces, which is all the test suite needs from debuginfo.
#
# Profiles are only honored in the workspace root; the same keys in a member
# manifest are ignored with a warning. [profile.test] inherits from this.
[profile.dev]
debug = "line-tables-only"
