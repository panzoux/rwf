[package]
name = "rwf-lib"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
zip = { workspace = true }

# Additional dependencies
# Clipboard: in-process native access (Win32 / NSPasteboard / X11 / Wayland).
# Default features are kept so Wayland works; the OSC 52 fallback in
# src/clipboard.rs covers headless and SSH sessions where none of these apply.
# default-features=false drops "image-data" (and its `image` dependency tree) —
# we only ever put text on the clipboard. wayland-data-control is kept so Wayland
# sessions work; it is inert on non-Unix targets.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
async-trait = "0.1"
dirs = "5.0"
filetime = "0.2"
rustmigemo = { workspace = true }
encoding_rs = "0.8"
sevenz-rust = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
iso9660 = { workspace = true }
trash = "5"

[target.'cfg(unix)'.dependencies]
users = "0.11"

[features]
default = []
migemo = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
