name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Shrink proptest from the 256-case default so CI stays fast.
  # Full-depth property testing remains a local concern.
  PROPTEST_CASES: "16"

# Toolchain is pinned to the version the zero-warning clippy baseline was
# verified against (matches the local dev toolchain). @stable would pull the
# newest release, whose new lints break -D warnings unpredictably.
# To bump: update the local toolchain (rustup update), fix any new lints,
# then raise this pin in the same commit.

jobs:
  lint:
    name: fmt + clippy (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # rwf-bin UI tests: fast, catches stale test references after refactors.
      - run: cargo test -p rwf -- --test-threads=1
      # rwf-lib: single-threaded (filesystem races). Baseline is zero failures
      # (see .claude/CLAUDE.local.md "Test Suite Status").
      - run: cargo test -p rwf-lib -- --test-threads=1
        env:
          # windows-latest ships 7-Zip: the 7z.dll tests must run, not skip (plan/8.11).
          RWF_REQUIRE_7ZIP: "1"
      - run: cargo test -p rwf-7zlib -- --test-threads=1
        env:
          RWF_REQUIRE_7ZIP: "1"

  # Linux exists to compile the code paths Windows never touches: arboard's
  # X11/Wayland clipboard backends, and every cfg(unix) block. Until this job
  # was added, none of that had ever been built anywhere.
  lint-linux:
    name: build + clippy (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # x11rb is pure Rust, but wl-clipboard-rs -> wayland-sys resolves
      # libwayland through pkg-config, so the dev package must be present.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev
      # --all-targets so tests type-check too: this is what proves the Linux
      # clipboard backend and the cfg(unix) paths actually compile.
      - run: cargo clippy --all-targets -- -D warnings

  # A real gate as of 2026-09-08. It started out advisory to measure the gap;
  # that came back as 9 failures, of which 1 was a genuine Windows-shaped test
  # assumption (fixed) and 8 were the two portability bugs of ROADMAP 7.18.
  # Both are fixed (2026-09-11): the fallback trash no longer anchors at an
  # unwritable `/`, and create_link snapshots render a platform-independent
  # layout. The only remaining unix ignores are the three Junction snapshots,
  # by design. Nothing is expected to fail here, so failures are real.
  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # 7zip: Debian's 7z.so, so the 7-Zip tests run on Linux too (plan/8.11). Its RAR
      # decoder is missing by design; RAR goes through unrar-ng there.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev 7zip
      - run: cargo test -p rwf -- --test-threads=1
      - run: cargo test -p rwf-lib -- --test-threads=1
        env:
          RWF_REQUIRE_7ZIP: "1"
      - run: cargo test -p rwf-7zlib -- --test-threads=1
        env:
          RWF_REQUIRE_7ZIP: "1"

  # Architecture lint: module cycles, wide directories, long files. Existing
  # debt is frozen in .deslop-please.allow; anything new fails. Runs on Windows
  # because the allow file was generated there and the tool only checks the
  # host's cfg (cfg(windows) modules are invisible on Linux).
  # Fixing debt: rerun `deslop-please --update-allow .deslop-please.allow`.
  architecture:
    name: deslop-please (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install deslop-please --version 0.1.4 --locked
      - run: deslop-please --allow .deslop-please.allow
